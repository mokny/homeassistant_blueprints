blueprint:
  name: "Intelligente Heizungssteuerung – Multi-Thermostat v5"
  description: >
    Zentrale Heizungssteuerung für beliebig viele Heizkörperthermostate.

    Version: v5

    Funktionen:
      - beliebig viele Thermostate
      - individuelle Komforttemperatur je Thermostat
      - individuelle Absenktemperatur je Thermostat
      - beliebig viele Fensterkontakte je Thermostat
      - einstellbare Fenster-Offen-Verzögerung
      - Anwesenheits-/Abwesenheitserkennung über mehrere Personen
      - wählbare Anwesenheitslogik
      - manueller Absenkschalter, der Anwesenheit übersteuert
      - optionaler automatischer Reset des Absenkschalters zu einer Uhrzeit
      - Normalbetrieb im HVAC-Modus AUTO
      - Sommermodus mit Frostschutztemperatur und HVAC OFF
      - automatische Ventilwartung im Sommer
      - konfigurierbares Wartungsintervall
      - automatische Wiederherstellung nach Fenster-Schließen
      - automatische Synchronisation nach Home-Assistant-Neustart
      - optionale frei konfigurierbare Benachrichtigungsaktion

    Priorität:
      1. Sommermodus / Ventilwartung
      2. Fenster offen
      3. Abwesenheit
      4. Komforttemperatur

  domain: automation

  input:
    thermostat_config:
      name: Heizkörper / Thermostate
      description: >
        Füge hier beliebig viele Heizkörper hinzu. Jeder Heizkörper kann
        eigene Temperaturen und beliebig viele Fensterkontakte besitzen.
      selector:
        object:
          multiple: true
          label_field: name
          description_field: thermostat
          fields:
            name:
              label: Name
              required: true
              selector:
                text:

            thermostat:
              label: Thermostat
              required: true
              selector:
                entity:
                  filter:
                    - domain: climate

            comfort_temperature:
              label: Komforttemperatur
              required: true
              selector:
                number:
                  min: 5
                  max: 30
                  step: 0.5
                  unit_of_measurement: "°C"
                  mode: slider

            setback_temperature:
              label: Absenktemperatur
              required: true
              selector:
                number:
                  min: 5
                  max: 25
                  step: 0.5
                  unit_of_measurement: "°C"
                  mode: slider

            windows:
              label: Fenster / Türen
              required: false
              selector:
                entity:
                  multiple: true
                  filter:
                    - domain: binary_sensor
                      device_class:
                        - window
                        - door
                        - opening

            window_open_delay:
              label: Abschaltverzögerung Fenster
              required: true
              selector:
                number:
                  min: 0
                  max: 60
                  step: 1
                  unit_of_measurement: min
                  mode: box

    summer_mode:
      name: Sommermodus
      description: >
        input_boolean für den Sommerbetrieb.
        Bei EIN werden alle Thermostate auf die Frostschutztemperatur gestellt
        und anschließend auf HVAC OFF geschaltet.
      selector:
        entity:
          filter:
            - domain: input_boolean

    persons:
      name: Personen für Anwesenheitserkennung
      description: >
        Personen, deren Home/Away-Status berücksichtigt werden soll.
        Wenn keine Person ausgewählt ist, wird keine Absenkung aufgrund
        von Abwesenheit durchgeführt.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: person

    absence_logic:
      name: Abwesenheitslogik
      description: >
        "Alle abwesend": Absenkung erst, wenn keine ausgewählte Person
        mehr zuhause ist.

        "Eine Person abwesend": Absenkung, sobald mindestens eine der
        ausgewählten Personen nicht zuhause ist.
      default: all_away
      selector:
        select:
          options:
            - label: "Alle ausgewählten Personen müssen abwesend sein"
              value: all_away
            - label: "Mindestens eine ausgewählte Person ist abwesend"
              value: any_away

    setback_override_switch:
      name: Manueller Absenkschalter
      description: >
        input_boolean für eine erzwungene Absenkung, zum Beispiel nachts.
        Solange dieser Schalter EIN ist, verwenden alle Thermostate die
        jeweilige Absenktemperatur – auch wenn Personen zuhause sind.
        Sommermodus und Fenster-Offen-Erkennung haben weiterhin Vorrang.
      selector:
        entity:
          filter:
            - domain: input_boolean

    setback_override_reset_enabled:
      name: Absenkschalter automatisch zurücksetzen
      description: >
        Wenn aktiviert, wird der manuelle Absenkschalter jeden Tag zur
        festgelegten Uhrzeit automatisch ausgeschaltet.
      default: false
      selector:
        boolean:

    setback_override_reset_time:
      name: Reset-Uhrzeit des Absenkschalters
      description: >
        Uhrzeit, zu der der manuelle Absenkschalter automatisch ausgeschaltet
        wird. Diese Einstellung wird nur verwendet, wenn der automatische
        Reset aktiviert ist.
      default: "06:00:00"
      selector:
        time:

    summer_temperature:
      name: Frostschutztemperatur Sommer
      default: 5
      selector:
        number:
          min: 5
          max: 15
          step: 0.5
          unit_of_measurement: "°C"
          mode: slider

    valve_maintenance_enabled:
      name: Ventilwartung aktivieren
      default: true
      selector:
        boolean:

    valve_maintenance_interval:
      name: Wartungsintervall
      description: >
        Abstand zwischen zwei Ventilwartungen in Tagen.
        Die Wartung findet ausschließlich im Sommermodus statt.
      default: 14
      selector:
        number:
          min: 1
          max: 90
          step: 1
          unit_of_measurement: Tage
          mode: box

    valve_maintenance_time:
      name: Uhrzeit der Ventilwartung
      default: "11:00:00"
      selector:
        time:

    valve_maintenance_temperature:
      name: Öffnungstemperatur bei Ventilwartung
      description: >
        Hohe Solltemperatur, mit der das Ventil während der Wartung
        vollständig geöffnet wird.
      default: 30
      selector:
        number:
          min: 20
          max: 35
          step: 0.5
          unit_of_measurement: "°C"
          mode: slider

    valve_maintenance_duration:
      name: Dauer der Ventilwartung
      description: >
        Wie lange die Ventile geöffnet bleiben.
      default:
        hours: 0
        minutes: 5
        seconds: 0
      selector:
        duration:

    notifications_enabled:
      name: Benachrichtigungen aktivieren
      default: false
      selector:
        boolean:

    notification_action:
      name: Benachrichtigungsaktion
      description: >
        Optionale Aktion für Benachrichtigungen.

        Verfügbare Template-Variablen:
          {{ heating_event }}
          {{ heating_message }}
      default: []
      selector:
        action:

variables:
  thermostat_config: !input thermostat_config
  summer_mode: !input summer_mode
  persons: !input persons
  absence_logic: !input absence_logic
  setback_override_switch: !input setback_override_switch
  setback_override_reset_enabled: !input setback_override_reset_enabled
  setback_override_reset_time: !input setback_override_reset_time
  summer_temperature: !input summer_temperature
  valve_maintenance_enabled: !input valve_maintenance_enabled
  valve_maintenance_interval: !input valve_maintenance_interval
  valve_maintenance_time: !input valve_maintenance_time
  notifications_enabled: !input notifications_enabled

  forced_setback_active: >
    {{ is_state(setback_override_switch, 'on') }}

  use_setback: >
    {% if is_state(setback_override_switch, 'on') %}
      true
    {% else %}
      {% set person_states = expand(persons) %}
      {% set total = person_states | count %}
      {% set home_count =
        person_states
        | selectattr('state', 'eq', 'home')
        | list
        | count
      %}
      {% if total == 0 %}
        false
      {% elif absence_logic == 'any_away' %}
        {{ home_count < total }}
      {% else %}
        {{ home_count == 0 }}
      {% endif %}
    {% endif %}

triggers:
  - trigger: time_pattern
    minutes: "/1"
    id: periodic

  - trigger: state
    entity_id: !input summer_mode
    id: summer_changed

  - trigger: state
    entity_id: !input persons
    id: presence_changed

  - trigger: state
    entity_id: !input setback_override_switch
    id: setback_override_changed

  - trigger: time
    at: !input setback_override_reset_time
    id: setback_override_reset_time

  - trigger: homeassistant
    event: start
    id: homeassistant_start

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: setback_override_reset_time
          - condition: template
            value_template: "{{ setback_override_reset_enabled | bool }}"
          - condition: state
            entity_id: !input setback_override_switch
            state: "on"
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: !input setback_override_switch

  - variables:
      maintenance_due: >
        {% set enabled = valve_maintenance_enabled | bool %}
        {% set summer = is_state(summer_mode, 'on') %}
        {% set interval = valve_maintenance_interval | int(14) %}
        {% set configured_time = valve_maintenance_time | string %}
        {% set current_time = now().strftime('%H:%M') %}
        {% set wanted_time = configured_time[0:5] %}
        {{
          enabled
          and summer
          and trigger.id == 'periodic'
          and current_time == wanted_time
          and ((now().date().toordinal() % interval) == 0)
        }}

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ maintenance_due | bool }}"
        sequence:
          - variables:
              heating_event: "Heizung: Ventilwartung gestartet"
              heating_message: >
                Die automatische Ventilwartung wurde gestartet.
                {{ thermostat_config | count }} Heizkörper werden geöffnet.

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ notifications_enabled | bool }}"
                sequence: !input notification_action

          - repeat:
              for_each: "{{ thermostat_config }}"
              sequence:
                - variables:
                    current_thermostat: "{{ repeat.item.thermostat }}"

                - action: climate.set_hvac_mode
                  target:
                    entity_id: "{{ current_thermostat }}"
                  data:
                    hvac_mode: auto
                  continue_on_error: true

                - action: climate.set_temperature
                  target:
                    entity_id: "{{ current_thermostat }}"
                  data:
                    temperature: !input valve_maintenance_temperature
                  continue_on_error: true

          - delay: !input valve_maintenance_duration

          - repeat:
              for_each: "{{ thermostat_config }}"
              sequence:
                - variables:
                    current_thermostat: "{{ repeat.item.thermostat }}"

                - action: climate.set_temperature
                  target:
                    entity_id: "{{ current_thermostat }}"
                  data:
                    temperature: "{{ summer_temperature | float }}"
                  continue_on_error: true

                - action: climate.set_hvac_mode
                  target:
                    entity_id: "{{ current_thermostat }}"
                  data:
                    hvac_mode: "off"
                  continue_on_error: true

          - variables:
              heating_event: "Heizung: Ventilwartung beendet"
              heating_message: >
                Die Ventilwartung wurde beendet.
                Alle Heizkörper wurden wieder in den Sommermodus versetzt.

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ notifications_enabled | bool }}"
                sequence: !input notification_action

          - stop: "Ventilwartung abgeschlossen."

  - repeat:
      for_each: "{{ thermostat_config }}"
      sequence:
        - variables:
            radiator_name: "{{ repeat.item.name }}"
            thermostat: "{{ repeat.item.thermostat }}"
            comfort_temperature: >
              {{ repeat.item.comfort_temperature | float }}
            setback_temperature: >
              {{ repeat.item.setback_temperature | float }}
            window_delay_minutes: >
              {{ repeat.item.window_open_delay | default(0) | float }}

            window_blocked: >
              {% set ns = namespace(blocked=false) %}
              {% set delay_seconds =
                (repeat.item.window_open_delay | default(0) | float) * 60
              %}
              {% for window in repeat.item.windows | default([]) %}
                {% if is_state(window, 'on') %}
                  {% set window_state = states.get(window) %}
                  {% if window_state is not none %}
                    {% set open_seconds =
                      as_timestamp(now())
                      - as_timestamp(window_state.last_changed)
                    %}
                    {% if open_seconds >= delay_seconds %}
                      {% set ns.blocked = true %}
                    {% endif %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {{ ns.blocked }}

            current_hvac_mode: "{{ states(repeat.item.thermostat) }}"

            current_temperature: >
              {{
                state_attr(
                  repeat.item.thermostat,
                  'temperature'
                ) | float(-99)
              }}

        - choose:
            - conditions:
                - condition: template
                  value_template: "{{ is_state(summer_mode, 'on') }}"
              sequence:
                - if:
                    - condition: template
                      value_template: >
                        {{
                          current_hvac_mode != 'off'
                          or
                          (
                            current_temperature
                            - (summer_temperature | float)
                          ) | abs > 0.1
                        }}
                  then:
                    - action: climate.set_temperature
                      target:
                        entity_id: "{{ thermostat }}"
                      data:
                        temperature: "{{ summer_temperature | float }}"
                      continue_on_error: true

                    - action: climate.set_hvac_mode
                      target:
                        entity_id: "{{ thermostat }}"
                      data:
                        hvac_mode: "off"
                      continue_on_error: true

                    - variables:
                        heating_event: "Heizung: Sommermodus"
                        heating_message: >
                          {{ radiator_name }} wurde auf
                          {{ summer_temperature }} °C gestellt
                          und ausgeschaltet.

                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ notifications_enabled | bool }}"
                          sequence: !input notification_action

          default:
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ window_blocked | bool }}"
                  sequence:
                    - if:
                        - condition: template
                          value_template: "{{ current_hvac_mode != 'off' }}"
                      then:
                        - action: climate.set_hvac_mode
                          target:
                            entity_id: "{{ thermostat }}"
                          data:
                            hvac_mode: "off"
                          continue_on_error: true

                        - variables:
                            heating_event: "Heizung: Fenster offen"
                            heating_message: >
                              {{ radiator_name }} wurde ausgeschaltet,
                              weil mindestens ein zugeordnetes Fenster
                              länger als
                              {{ window_delay_minutes | round(0) }}
                              Minuten geöffnet ist.

                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ notifications_enabled | bool }}"
                              sequence: !input notification_action

              default:
                - variables:
                    desired_temperature: >
                      {% if use_setback | bool %}
                        {{ setback_temperature }}
                      {% else %}
                        {{ comfort_temperature }}
                      {% endif %}

                    desired_reason: >
                      {% if forced_setback_active | bool %}
                        Manueller Absenkschalter
                      {% elif use_setback | bool %}
                        Abwesenheit
                      {% else %}
                        Komfortbetrieb
                      {% endif %}

                - if:
                    - condition: template
                      value_template: "{{ states(thermostat) != 'auto' }}"
                  then:
                    - action: climate.set_hvac_mode
                      target:
                        entity_id: "{{ thermostat }}"
                      data:
                        hvac_mode: auto
                      continue_on_error: true

                - if:
                    - condition: template
                      value_template: >
                        {{
                          (
                            state_attr(
                              thermostat,
                              'temperature'
                            ) | float(-99)
                            - desired_temperature | float
                          ) | abs > 0.1
                        }}
                  then:
                    - action: climate.set_temperature
                      target:
                        entity_id: "{{ thermostat }}"
                      data:
                        temperature: "{{ desired_temperature | float }}"
                      continue_on_error: true

                    - variables:
                        heating_event: "Heizung: {{ desired_reason }}"
                        heating_message: >
                          {{ radiator_name }} wurde auf
                          {{ desired_temperature }} °C gestellt.
                          Grund: {{ desired_reason }}.

                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ notifications_enabled | bool }}"
                          sequence: !input notification_action

mode: single
max_exceeded: silent
